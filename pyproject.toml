[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flakehunter"
dynamic = ["version"]
description = "Find flaky tests, real regressions and slowdowns from your Allure results history, right inside GitLab CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Houssem Raissi" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["flaky-tests", "allure", "playwright", "pytest", "gitlab-ci", "qa", "test-stability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rayssi/flakehunter"
Documentation = "https://github.com/rayssi/flakehunter#readme"
Changelog = "https://github.com/rayssi/flakehunter/blob/main/CHANGELOG.md"
Issues = "https://github.com/rayssi/flakehunter/issues"

[project.scripts]
flakehunter = "flakehunter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "bandit>=1.7"]

[tool.setuptools.dynamic]
version = { attr = "flakehunter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flakehunter = ["py.typed", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["flakehunter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]           # assert is how pytest works
"examples/**" = ["S311", "S324"] # demo data: plain random and md5 are fine here

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
